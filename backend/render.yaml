services:
  - type: web
    name: agent-gateway
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: agent_gateway
      - key: DEFAULT_TOKENS
        value: "1000"
      - key: DEFAULT_EXPIRY_DAYS
        value: "30"